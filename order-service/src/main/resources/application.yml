server:
  port: ${SERVER_PORT:8082}
spring:
  application:
    name: order-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/orderdb}
    username: ${SPRING_DATASOURCE_USERNAME:ecommerce}
    password: ${SPRING_DATASOURCE_PASSWORD:ecommerce_demo_pw}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
services:
  product-url: ${PRODUCT_SERVICE_URL:http://localhost:8081}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
