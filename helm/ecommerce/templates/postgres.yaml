apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-postgres-init
  namespace: {{ .Values.namespace }}
data:
  01-create-databases.sql: |
    CREATE DATABASE productdb;
    CREATE DATABASE orderdb;
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ecommerce-postgres-data
  namespace: {{ .Values.namespace }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-postgres
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ecommerce-postgres
  template:
    metadata:
      labels:
        app: ecommerce-postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.username | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.password | quote }}
            - name: POSTGRES_DB
              value: postgres
          readinessProbe:
            exec:
              command: ["sh","-c","pg_isready -U {{ .Values.postgres.username }} -d postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ecommerce-postgres-data
        - name: init
          configMap:
            name: ecommerce-postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: ecommerce-postgres
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: ecommerce-postgres
  ports:
    - port: 5432
      targetPort: 5432
